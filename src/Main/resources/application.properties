# ============================================================
# CONFIGURATION DE L'APPLICATION — location-voitures
# ============================================================

# ------------------------------------------------------------
# CONNEXION A LA BASE DE DONNEES MYSQL
# Base: location_voitures | Utilisateur: root
# ------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/location_voitures?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Sami09!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
# CONTEXTE DE L'APPLICATION
# Chemin d'acces: http://localhost:8080/location-voitures
# (le contexte est gere par Tomcat dans le nom du WAR)
# ------------------------------------------------------------
server.servlet.context-path=/

# ------------------------------------------------------------
# INITIALISATION SQL
# never = les tables sont creees manuellement via sql/schema.sql
# ------------------------------------------------------------
spring.sql.init.mode=never

# ------------------------------------------------------------
# THEME PRIMEFACES
# saga = theme clair (blanc) — design conservé
# ------------------------------------------------------------
primefaces.theme=saga

# JOURNAUX - fichier de diagnostic (interet dev)
logging.file.name=C:/Users/bouss/AppData/Local/Temp/opencode/app.log